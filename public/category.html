<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ক্যাটাগরি ও অনুসন্ধান | Daily Express News</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="container top-bar-inner">
      <div id="current-date"><i class="far fa-calendar-alt"></i> লোড হচ্ছে...</div>
      <div>
        <a href="/admin/login" style="color: #f1f5f9; font-weight: 600;">
          <i class="fas fa-lock"></i> অ্যাডমিন প্যানেল
        </a>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="main-header">
    <div class="container header-inner">
      <div class="brand-logo">
        <a href="/">
          <h1 id="site-name-display">প্রতিদিনের সংবাদ</h1>
          <p id="site-tagline-display">সত্য ও নিষ্ঠার সাথে নিরপেক্ষ সংবাদ</p>
        </a>
      </div>
      <form action="/category.html" method="GET" style="display: flex; gap: 6px;">
        <input type="text" name="search" id="header-search-input" placeholder="অনুসন্ধান করুন..." class="form-control" style="width: 240px; padding: 8px 12px;">
        <button type="submit" class="btn btn-primary"><i class="fas fa-search"></i></button>
      </form>
    </div>
  </header>

  <!-- Navigation -->
  <nav class="nav-bar">
    <div class="container nav-inner">
      <ul class="nav-links" id="category-nav">
        <li><a href="/">প্রচ্ছদ</a></li>
      </ul>
    </div>
  </nav>

  <!-- Category Main Body -->
  <main class="container" style="margin-top: 24px; margin-bottom: 50px;">
    
    <div class="section-header" style="margin-top: 0;">
      <h1 class="section-title" id="page-title">সংবাদ তালিকা</h1>
      <span id="results-count" class="badge badge-secondary" style="font-size: 14px;"></span>
    </div>

    <!-- Articles Grid -->
    <div class="news-card-grid" id="category-articles-grid" style="grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));">
      <div style="grid-column: 1 / -1; padding: 40px; text-align: center; background: #fff; border-radius: 8px;">
        <i class="fas fa-spinner fa-spin fa-2x" style="color: var(--primary);"></i>
        <p style="margin-top: 10px; color: var(--text-muted);">সংবাদ লোড হচ্ছে...</p>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer style="background: #0f172a; color: #94a3b8; padding: 30px 0 20px 0; border-top: 4px solid var(--primary);">
    <div class="container" style="text-align: center; font-size: 14px;">
      <p>© 2026 Daily Express News Portal. সর্বস্বত্ব সংরক্ষিত।</p>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('current-date').innerHTML = `<i class="far fa-calendar-alt"></i> ${Utils.getCurrentBengaliDate()}`;

      const params = new URLSearchParams(window.location.search);
      const categoryParam = params.get('category');
      const searchParam = params.get('search');

      if (searchParam) {
        document.getElementById('header-search-input').value = searchParam;
        document.getElementById('page-title').innerText = `অনুসন্ধানের ফলাফল: "${searchParam}"`;
      }

      // Load Categories
      try {
        const catRes = await API.getCategories();
        if (catRes.categories) {
          const nav = document.getElementById('category-nav');
          catRes.categories.forEach(c => {
            const li = document.createElement('li');
            if (categoryParam === c.slug) {
              li.className = 'active';
              document.getElementById('page-title').innerText = `বিভাগ: ${c.name_bn}`;
            }
            li.innerHTML = `<a href="/category.html?category=${c.slug}">${c.name_bn}</a>`;
            nav.appendChild(li);
          });
        }
      } catch (e) {
        console.error(e);
      }

      // Load Articles
      try {
        const reqQuery = {};
        if (categoryParam) reqQuery.category = categoryParam;
        if (searchParam) reqQuery.search = searchParam;

        const res = await API.getArticles(reqQuery);
        const grid = document.getElementById('category-articles-grid');

        if (!res.articles || res.articles.length === 0) {
          grid.innerHTML = `
            <div style="grid-column: 1 / -1; padding: 50px; text-align: center; background: #fff; border-radius: 8px;">
              <i class="far fa-newspaper fa-3x" style="color: var(--text-muted); margin-bottom: 15px;"></i>
              <h3>কোনো সংবাদ পাওয়া যায়নি।</h3>
              <p style="color: var(--text-muted); margin-top: 6px;">ভিন্ন কীওয়ার্ড দিয়ে অনুসন্ধান করুন অথবা প্রচ্ছদে ফিরে যান।</p>
              <a href="/" class="btn btn-primary" style="margin-top: 15px;">হোমপেজ</a>
            </div>
          `;
          return;
        }

        document.getElementById('results-count').innerText = `মোট ${Utils.toBengaliNumber(res.articles.length)} টি সংবাদ`;

        grid.innerHTML = res.articles.map(a => `
          <div class="news-card">
            <img src="${a.image_url || 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=600'}" alt="${a.title}" class="news-card-img">
            <div class="news-card-body">
              <span class="badge badge-primary" style="align-self: flex-start; margin-bottom: 6px;">${a.category_name_bn}</span>
              <h3 style="font-size: 18px; margin-bottom: 8px; line-height: 1.4;">
                <a href="/article.html?id=${a.id}">${a.title}</a>
              </h3>
              <p style="font-size: 14px; color: var(--text-muted); flex-grow: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">
                ${a.summary || ''}
              </p>
              <div class="news-meta">
                <span><i class="fas fa-user-edit"></i> ${a.author_name}</span>
                <span><i class="far fa-clock"></i> ${Utils.timeAgo(a.published_at)}</span>
              </div>
            </div>
          </div>
        `).join('');

      } catch (err) {
        document.getElementById('category-articles-grid').innerHTML = `
          <div style="grid-column: 1 / -1; padding: 40px; text-align: center; background: #fff; border-radius: 8px;">
            <h3>ত্রুটি: ${err.message}</h3>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
