<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>সাহিত্যকর্ম বিস্তারিত | খুলনা বিশ্ববিদ্যালয় লেখক সংঘ</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="container top-bar-inner">
      <div id="current-date"><i class="far fa-calendar-alt"></i> লোড হচ্ছে...</div>
      <div>
        <a href="/admin/login" style="color: #f1f5f9; font-weight: 600;">
          <i class="fas fa-lock"></i> লেখক ও সম্পাদক প্যানেল
        </a>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="main-header">
    <div class="container header-inner">
      <div class="brand-logo">
        <a href="/" style="display: flex; align-items: center; gap: 12px;">
          <div style="width: 44px; height: 44px; background: #fee2e2; color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;">
            <i class="fas fa-feather-alt"></i>
          </div>
          <div>
            <h1 id="site-name-display" style="font-size: 26px; font-weight: 800; color: var(--primary); margin: 0;">খুলনা বিশ্ববিদ্যালয় লেখক সংঘ</h1>
            <p id="site-tagline-display" style="font-size: 13px; color: var(--text-muted); margin: 2px 0 0 0;">মুক্তচিন্তা ও সৃজনশীল সাহিত্যের উন্মুক্ত প্রাঙ্গণ</p>
          </div>
        </a>
      </div>
      <form action="/category.html" method="GET" style="display: flex; gap: 6px;">
        <input type="text" name="search" placeholder="কবিতা, গল্প বা লেখক খুঁজুন..." class="form-control" style="width: 240px; padding: 8px 12px;">
        <button type="submit" class="btn btn-primary"><i class="fas fa-search"></i></button>
      </form>
    </div>
  </header>

  <!-- Navigation -->
  <nav class="nav-bar">
    <div class="container nav-inner">
      <ul class="nav-links" id="category-nav">
        <li><a href="/">প্রচ্ছদ</a></li>
      </ul>
    </div>
  </nav>

  <!-- Main Article Content -->
  <main class="container" style="margin-top: 24px; margin-bottom: 50px;">
    
    <div style="display: grid; grid-template-columns: 2.2fr 1fr; gap: 30px;">
      
      <!-- Left Column: Article Body -->
      <article id="article-view-container">
        <div style="padding: 40px; text-align: center; background: #fff; border-radius: 8px;">
          <i class="fas fa-spinner fa-spin fa-2x" style="color: var(--primary);"></i>
          <p style="margin-top: 10px; color: var(--text-muted);">লেখা লোড হচ্ছে...</p>
        </div>
      </article>

      <!-- Right Column: Sidebar -->
      <aside>
        <div style="background: #ffffff; border-radius: 8px; padding: 20px; border: 1px solid var(--border-color); margin-bottom: 24px;">
          <div class="section-title" style="margin-top: 0; margin-bottom: 14px;">একই বিভাগের অন্যান্য লেখা</div>
          <div id="related-articles-list" style="display: flex; flex-direction: column; gap: 14px;">
            <!-- Related articles -->
          </div>
        </div>

        <div style="background: #ffffff; border-radius: 8px; padding: 20px; border: 1px solid var(--border-color); position: sticky; top: 70px;">
          <div class="section-title" style="margin-top: 0; margin-bottom: 14px;">পাঠকপ্রিয় লেখা</div>
          <ul class="popular-list" id="popular-news-list">
            <!-- Popular articles -->
          </ul>
        </div>
      </aside>

    </div>

  </main>

  <!-- Footer -->
  <footer style="background: #0f172a; color: #94a3b8; padding: 30px 0 20px 0; border-top: 4px solid var(--primary);">
    <div class="container" style="text-align: center; font-size: 14px;">
      <p id="footer-copyright">© 2026 Khulna University Writers' Society (KUWS). সর্বস্বত্ব সংরক্ষিত।</p>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('current-date').innerHTML = `<i class="far fa-calendar-alt"></i> ${Utils.getCurrentBengaliDate()}`;
      
      // Load Categories for Navbar
      try {
        const catRes = await API.getCategories();
        if (catRes.categories) {
          const nav = document.getElementById('category-nav');
          catRes.categories.forEach(c => {
            const li = document.createElement('li');
            li.innerHTML = `<a href="/category.html?category=${c.slug}">${c.name_bn}</a>`;
            nav.appendChild(li);
          });
        }
      } catch (e) {
        console.error(e);
      }

      // Load Single Article Details
      const params = new URLSearchParams(window.location.search);
      const slugOrId = params.get('id') || params.get('slug');

      if (!slugOrId) {
        document.getElementById('article-view-container').innerHTML = `
          <div style="padding: 40px; text-align: center; background: #fff; border-radius: 8px;">
            <h3>কোনো লেখা নির্দিষ্ট করা হয়নি।</h3>
            <a href="/" class="btn btn-primary" style="margin-top: 15px;">হোমপেজে ফিরে যান</a>
          </div>
        `;
        return;
      }

      try {
        const res = await API.getArticleDetails(slugOrId);
        const a = res.article;
        document.title = `${a.title} | খুলনা বিশ্ববিদ্যালয় লেখক সংঘ`;

        // Render Article
        const container = document.getElementById('article-view-container');
        container.innerHTML = `
          <div style="background: #ffffff; border-radius: 8px; padding: 24px; border: 1px solid var(--border-color);">
            
            <div style="margin-bottom: 12px;">
              <a href="/category.html?category=${a.category_slug}" class="badge badge-primary" style="font-size: 13px; padding: 4px 10px;">
                ${a.category_name_bn}
              </a>
            </div>

            <h1 class="article-headline">${a.title}</h1>

            <div class="article-author-box">
              <img src="${a.author_avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150'}" alt="${a.author_name}" class="author-avatar">
              <div>
                <div style="font-weight: 700; color: #0f172a;"><i class="fas fa-pen-nib"></i> ${a.author_name}</div>
                <div style="font-size: 13px; color: var(--text-muted);">
                  ${a.author_designation || 'লেখক ও গবেষক'} • <i class="far fa-clock"></i> প্রকাশিত: ${Utils.timeAgo(a.published_at || a.created_at)}
                  • <i class="far fa-eye"></i> পঠিত: ${Utils.toBengaliNumber(a.views)} বার
                </div>
              </div>
            </div>

            ${a.image_url ? `
              <div style="margin-bottom: 20px;">
                <img src="${a.image_url}" alt="${a.title}" class="article-main-image">
                ${a.image_caption ? `<p class="article-caption"><i class="fas fa-camera"></i> ${a.image_caption}</p>` : ''}
              </div>
            ` : ''}

            <div class="article-content">
              ${a.content}
            </div>

            ${a.tags ? `
              <div style="margin: 24px 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
                <span style="font-weight: 600; font-size: 14px; color: var(--text-muted);"><i class="fas fa-tags"></i> ট্যাগ:</span>
                ${a.tags.split(',').map(t => `<span class="badge badge-secondary" style="font-size: 13px;">${t.trim()}</span>`).join('')}
              </div>
            ` : ''}

            <!-- Social Share -->
            <div style="border-top: 1px solid var(--border-color); padding: 18px 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
              <span style="font-weight: 600; font-size: 14px;">শেয়ার করুন:</span>
              <button class="btn btn-sm btn-secondary" onclick="shareSocial('fb')"><i class="fab fa-facebook" style="color: #1877f2;"></i> ফেসবুক</button>
              <button class="btn btn-sm btn-secondary" onclick="shareSocial('twitter')"><i class="fab fa-twitter" style="color: #1da1f2;"></i> টুইটার</button>
              <button class="btn btn-sm btn-secondary" onclick="shareSocial('whatsapp')"><i class="fab fa-whatsapp" style="color: #25d366;"></i> হোয়াটসঅ্যাপ</button>
              <button class="btn btn-sm btn-secondary" onclick="copyLink()"><i class="fas fa-link"></i> লিংক কপি</button>
            </div>

            <!-- Comment Box -->
            <div style="margin-top: 30px; border-top: 2px solid var(--border-color); padding-top: 24px;">
              <h3 style="font-size: 20px; margin-bottom: 16px;"><i class="far fa-comments"></i> পাঠ প্রতিক্রিয়া ও মন্তব্য</h3>
              <form id="comment-form" style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px;">
                <input type="text" id="comment-name" class="form-control" placeholder="আপনার নাম লিখুন" required>
                <textarea id="comment-text" class="form-control" rows="3" placeholder="লেখা সম্পর্কে আপনার মূল্যায়ন বা মন্তব্য লিখুন..." required></textarea>
                <div>
                  <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i> মন্তব্য প্রকাশ করুন</button>
                </div>
              </form>

              <!-- Comments List -->
              <div id="comments-list" style="display: flex; flex-direction: column; gap: 12px;">
                ${res.comments && res.comments.length > 0 ? res.comments.map(c => `
                  <div style="background: #f8fafc; padding: 12px 16px; border-radius: 6px; border: 1px solid var(--border-color);">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                      <strong style="color: #0f172a;">${c.name}</strong>
                      <span style="font-size: 12px; color: var(--text-muted);">${Utils.timeAgo(c.created_at)}</span>
                    </div>
                    <p style="font-size: 14px; color: #334155;">${c.comment}</p>
                  </div>
                `).join('') : '<p style="color: var(--text-muted); font-size: 14px;">এখনও কোনো মন্তব্য করা হয়নি। আপনিই প্রথম আপনার মূল্যবান মন্তব্য দিন!</p>'}
              </div>
            </div>

          </div>
        `;

        // Handle Comment Submission
        document.getElementById('comment-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          const name = document.getElementById('comment-name').value;
          const comment = document.getElementById('comment-text').value;

          try {
            await API.postComment(a.id, { name, comment });
            Utils.showToast('মন্তব্য সফলভাবে যোগ করা হয়েছে!', 'success');
            setTimeout(() => window.location.reload(), 1000);
          } catch (err) {
            Utils.showToast(err.message, 'error');
          }
        });

        // Render Related Articles
        const relatedList = document.getElementById('related-articles-list');
        if (res.related && res.related.length > 0) {
          relatedList.innerHTML = res.related.map(r => `
            <div style="display: flex; gap: 10px; align-items: center;">
              <img src="${r.image_url || 'https://images.unsplash.com/photo-1455390582262-044cdead277a?w=150'}" style="width: 75px; height: 55px; border-radius: 4px; object-fit: cover;">
              <div>
                <a href="/article.html?id=${r.id}" style="font-size: 14px; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${r.title}</a>
                <span style="font-size: 12px; color: var(--text-muted);">${Utils.timeAgo(r.published_at)}</span>
              </div>
            </div>
          `).join('');
        } else {
          relatedList.innerHTML = '<p style="color: var(--text-muted); font-size: 13px;">কোনো সম্পর্কিত লেখা পাওয়া যায়নি।</p>';
        }

      } catch (err) {
        document.getElementById('article-view-container').innerHTML = `
          <div style="padding: 40px; text-align: center; background: #fff; border-radius: 8px;">
            <h3>ত্রুটি: ${err.message}</h3>
            <a href="/" class="btn btn-primary" style="margin-top: 15px;">হোমপেজে ফিরে যান</a>
          </div>
        `;
      }

      // Load Popular News for Sidebar
      try {
        const popRes = await API.getArticles({ limit: 5 });
        if (popRes.articles) {
          const sorted = [...popRes.articles].sort((x, y) => (y.views || 0) - (x.views || 0));
          document.getElementById('popular-news-list').innerHTML = sorted.map((p, idx) => `
            <li class="popular-item">
              <div class="popular-rank">${Utils.toBengaliNumber(idx + 1)}</div>
              <div>
                <a href="/article.html?id=${p.id}" style="font-size: 14px; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${p.title}</a>
                <div class="news-meta" style="margin-top: 4px;">
                  <span><i class="far fa-clock"></i> ${Utils.timeAgo(p.published_at)}</span>
                </div>
              </div>
            </li>
          `).join('');
        }
      } catch (e) {}

    });

    function shareSocial(platform) {
      const url = encodeURIComponent(window.location.href);
      const title = encodeURIComponent(document.title);
      let targetUrl = '';
      if (platform === 'fb') targetUrl = `https://www.facebook.com/sharer/sharer.php?u=${url}`;
      if (platform === 'twitter') targetUrl = `https://twitter.com/intent/tweet?text=${title}&url=${url}`;
      if (platform === 'whatsapp') targetUrl = `https://api.whatsapp.com/send?text=${title}%20${url}`;
      window.open(targetUrl, '_blank', 'width=600,height=400');
    }

    function copyLink() {
      navigator.clipboard.writeText(window.location.href);
      Utils.showToast('লেখার লিংক কপি করা হয়েছে!', 'info');
    }
  </script>
</body>
</html>
